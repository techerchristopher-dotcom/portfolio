<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maestro AI — Étude de cas IA Automation · Christopher TECHER</title>
<meta name="description" content="Workflow n8n post-call : de l'appel terminé à la tâche CRM en moins de 10 secondes. Démonstration IA Automation par Christopher TECHER.">
<link rel="canonical" href="maestro.html">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --bg:       #0D0D0D;
  --surface:  #141414;
  --surface2: #1C1C1C;
  --border:   #222222;
  --border2:  #333333;
  --text:     #EEEEEE;
  --text2:    #666666;
  --text3:    #3A3A3A;
  --lime:     #C8FC00;
  --lime-dim: rgba(200,252,0,0.07);
  --lime-b:   rgba(200,252,0,0.18);
  /* Legacy compat */
  --navy:      #1E1E1E;
  --blue:      #2A2A2A;
  --light-blue:#C8C8C8;
  --accent:    #C8FC00;
  --dark:      #0D0D0D;
  --dark2:     #161616;
  --white:     #EEEEEE;
  --grey:      #777777;
  --green:     #86efac;
  --card-bg:   #1A1A1A;
  --glass:     rgba(255,255,255,0.04);
}
* { margin:0; padding:0; box-sizing:border-box; }
html, body { height:100%; background:var(--dark); color:#fff; font-family:'Plus Jakarta Sans',system-ui,sans-serif; }
nav {
  position:fixed; top:0; left:0; right:0; z-index:1000;
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 40px;
  background:rgba(13,13,13,0.97);
  backdrop-filter:blur(20px);
  border-bottom:1px solid #222;
}
.nav-left { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
.nav-logo {
  font-size:1.1rem; font-weight:700; color:var(--accent);
  text-decoration:none; letter-spacing:1px;
}
.nav-sep { color:rgba(139,154,176,0.5); }
.breadcrumb { display:flex; align-items:center; gap:8px; font-size:.82rem; color:var(--grey); }
.breadcrumb a { color:var(--grey); text-decoration:none; transition:color .2s; }
.breadcrumb a:hover { color:var(--accent); }
.breadcrumb .current { color:var(--gold); font-weight:600; }
.nav-right { display:flex; align-items:center; gap:12px; }
.nav-back {
  display:inline-flex; align-items:center; gap:6px;
  background:rgba(255,255,255,0.06); border:1.5px solid rgba(200,252,0,0.2);
  border-radius:50px; padding:8px 18px;
  color:var(--accent); text-decoration:none; font-size:.82rem; font-weight:700;
  transition:all .2s;
}
.nav-back:hover { background:rgba(200,252,0,0.12); transform:translateY(-1px); }
.lang-btn {
  display:flex; align-items:center; gap:6px;
  background:rgba(255,255,255,0.06); border:1.5px solid rgba(200,252,0,0.2);
  border-radius:50px; padding:6px 14px; cursor:pointer;
  color:var(--accent); font-size:.82rem; font-weight:700;
}
.maestro-frame-wrap {
  position:fixed; top:56px; left:0; right:0; bottom:0;
}
.maestro-frame {
  width:100%; height:100%; border:none; display:block;
}
@media(max-width:768px) {
  nav { padding:12px 16px; }
  .breadcrumb { display:none; }
  .nav-back span.hide-mobile { display:none; }
  .maestro-frame-wrap { top:52px; }
}
</style>
</head>
<body>

<nav>
  <div class="nav-left">
    <a href="index.html" class="nav-logo" style="color:var(--text);font-weight:800;font-size:1rem;letter-spacing:-.01em">CT<span style="color:#C8FC00">.</span></a>
    <span class="nav-sep" aria-hidden="true">·</span>
    <div class="breadcrumb">
      <a href="index.html" data-i18n="bc_portfolio">Portfolio</a>
      <span>/</span>
      <span class="current" data-i18n="bc_case">Étude de cas IA Automation</span>
    </div>
  </div>
  <div class="nav-right">
    <a href="index.html#work" class="nav-back">
      <span>←</span> <span class="hide-mobile" data-i18n="nav_back">Retour au portfolio</span>
    </a>
    <button class="lang-btn" onclick="toggleLang()" aria-label="Switch language">
      <span id="lang-flag">🇬🇧</span>
      <span id="lang-txt">EN</span>
    </button>
  </div>
</nav>

<div class="maestro-frame-wrap">
  <iframe
    class="maestro-frame"
    src="maestro/index.html"
    title="Maestro AI — Post-Call Automation Demo"
    loading="eager"
    allow="fullscreen"
  ></iframe>
</div>

<script>
const T = {
  fr: {
    bc_portfolio:'Portfolio', bc_case:'Étude de cas IA Automation', nav_back:'Retour au portfolio'
  },
  en: {
    bc_portfolio:'Portfolio', bc_case:'AI Automation Case Study', nav_back:'Back to portfolio'
  }
};
let currentLang = 'fr';
function setLang(lang) {
  currentLang = lang;
  const d = T[lang];
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.dataset.i18n;
    if (d[key] !== undefined) el.textContent = d[key];
  });
  document.getElementById('lang-flag').textContent = lang === 'fr' ? '🇬🇧' : '🇫🇷';
  document.getElementById('lang-txt').textContent = lang === 'fr' ? 'EN' : 'FR';
  document.documentElement.lang = lang;
  try { localStorage.setItem('ct-lang', lang); } catch(e) {}
}
function toggleLang() { setLang(currentLang === 'fr' ? 'en' : 'fr'); }
try {
  const saved = localStorage.getItem('ct-lang');
  if (saved && saved !== 'fr') setLang(saved);
} catch(e) {}
</script>
</body>
</html>
